<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Index</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<!--
    Multiple Screen Sizes:
        xs: phones <768px wide
        sm: tablets >= 768px wide
        md: small laptops >= 992px wide
        lg: laptops and desktops >=1200px wide


        place multiple size styles to mimic different media queries

-->
<div class="container">
    <div class="row">
        <div class="col" style><h1>Hello World!</h1></div>
    </div>

    <div class="row">
        <!-- Examples of multiple size styles -->
        <div class="col-lg-6 col-sm-1" style="background-color:lightblue"><h1>2 Cols</h1></div>
        <div class="col-lg-6 col-sm-11" style="background-color:lightgreen"><h1>2 Cols</h1></div>
    </div>
    <div class="row">
        <div class="col"><h1>3 Cols</h1></div>
        <div class="col"><h1>3 Cols</h1></div>
        <div class="col"><h1>3 Cols</h1></div>
    </div>
    <div class="row">
        <div class="col"><h1>4 Cols</h1></div>
        <div class="col"><h1>4 Cols</h1></div>
        <div class="col"><h1>4 Cols</h1></div>
        <div class="col"><h1>4 Cols</h1></div>
    </div>
    <div class="row">
        <div class="row">
            <div class="col-1"><h1>Left Sidebar</h1></div>
            <div class="col-10" style="text-align: center"><h1>Content</h1></div>
            <div class="col-1"><h1>Right Sidebar</h1></div>
        </div>
    </div>

    <div class="row">
        <!-- Moving from horizontal to stacked -->
        <div class="col-sm-6" style="background-color:lightblue"><h1>2 Cols</h1></div>
        <div class="col-sm-6 " style="background-color:lightgreen"><h1>2 Cols</h1></div>
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
