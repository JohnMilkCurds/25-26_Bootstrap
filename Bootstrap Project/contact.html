<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class=" bg-success">
<div class="container bg-primary">

    <div class="jumbotron">
        <h1>The Ryan Mauro Experience</h1>
    </div>
    <!-- NavBar -->
    <div class="row">
        <nav class="navbar navbar-default navbar-expand-sm bg-danger navbar-dark">
            <div class="container-fluid">
                <ul class="nav navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About me</a></li>
                    <li class="nav-item"><a class="nav-link" href="skills.html">Skills</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact me</a></li>
                </ul>
                <ul class="nav navbar-nav ms-auto">
                    <li class=""><button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">Log in</button></li>
                </ul>
                <div class="modal fade" id="myModal">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h4 class="modal-title">Enter your information to log in</h4>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="mb-3 mt-3">
                                    <label class="form-label" for="email">Email:</label>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter email">
                                </div>

                                <div class="mb-3 mt-3">
                                    <label class="form-label" for="pwd">Password:</label>
                                    <input type="password" name="pwd" id="pwd" placeholder="Enter Password" class="form-control">
                                </div>

                                <div class="mb-3 mt-3">
                                    <label class="form-check-label">
                                        <input type="checkbox" name="remember" class="form-check-input"> Remember Me
                                    </label>
                                </div>

                                <div class="spinner-border text-primary"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

    </div>
    <div class="row">
        <div class="container bg-warning mb-3 mt-3 text-light">
            <form action="#" method="GET">
                <!-- Email Field -->
                <div class="mb-3 mt-3">
                    <label class="form-label" for="email">Email:</label>
                    <label for="eml"></label><input type="email" class="form-control" id="eml" name="email" placeholder="Enter email">
                </div>
                <!-- Phone Number -->
                <div class="mb-3 mt-3">

                </div>
                <!-- Checkbox -->
                <div class="mb-3 mt-3">
                    <label class="form-check-label">
                        <input type="checkbox" name="remember" class="form-check-input"> Do you want to be sent monthly emails?
                    </label>
                </div>
                <!-- TextArea -->
                <div class="mb-3 mt-3">
                    <label for="feedback" class="form-label">Feedback</label>
                    <textarea class="form-control" rows="3" id="feedback" name="feedback"></textarea>
                </div>
                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>


    <!-- Footer -->
    <div class="row">
        <footer class="page-footer bg-danger text-white">RMauro Unlimited 2025 all rights reserved</footer>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
